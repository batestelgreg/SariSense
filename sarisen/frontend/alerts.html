<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SariSense — Alerts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div>
        <div class="brand-name">SariSense</div>
        <div class="brand-sub">AI restock assistant</div>
      </div>
    </div>
    <nav>
      <a class="nav-link-side" href="dashboard.html"><i class="bi bi-grid-1x2 ico"></i> Dashboard</a>
      <a class="nav-link-side" href="sales.html"><i class="bi bi-plus-circle ico"></i> Record Sales</a>
      <a class="nav-link-side active" href="alerts.html"><i class="bi bi-exclamation-triangle ico"></i> Alerts</a>
    </nav>
    <div class="sidebar-foot">
      <div data-store-name style="color:#dbe4f3;font-weight:600;margin-bottom:4px">My Store</div>
      <a href="#" data-logout style="color:#8fa2c2;font-size:12px">Log out</a>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1 class="page-title">Anomaly Alerts</h1>
        <p class="page-sub">Days with unusual sales — possible theft, spoilage, or a recording error.</p>
      </div>
      <button id="refreshBtn" class="btn-x btn-ghost-x"><i class="bi bi-arrow-clockwise"></i> Re-scan</button>
    </div>

    <div class="card-x">
      <h2>Detected anomalies <span class="hint">Isolation Forest · last 30 days</span></h2>
      <div id="alertList">
        <div class="empty">Loading…</div>
      </div>
    </div>
  </main>
</div>

<nav class="mobile-nav">
  <a href="dashboard.html"><span class="mi">▦</span>Dashboard</a>
  <a href="sales.html"><span class="mi">＋</span>Sales</a>
  <a href="alerts.html" class="active"><span class="mi">⚠</span>Alerts</a>
</nav>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/alerts.js"></script>
</body>
</html>
